# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
    # Base images in the root Dockerfile
    - package-ecosystem: "docker"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "tuesday"
          time: "08:00"
      cooldown:
          default-days: 7
      commit-message:
          prefix: "deps"
      rebase-strategy: "auto"
      groups:
          docker-minor-and-patch:
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"
          docker-major:
              patterns:
                  - "*"
              update-types:
                  - "major"

    # Cargo dependencies for all workspace members
    - package-ecosystem: "cargo"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "tuesday"
          time: "08:00"
      cooldown:
        default-days: 7
      commit-message:
          prefix: "deps"
      rebase-strategy: "auto"
      # Cover both direct and transitive deps
      allow:
        - dependency-type: "all"
      groups:
          # Cargo classifies 0.x -> 0.(x+1) and 0.0.x patch updates as major.
          cargo-minor-and-patch:
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"
          cargo-major:
              patterns:
                  - "*"
              update-types:
                  - "major"

    # npm dependencies for JS bindings
    - package-ecosystem: "npm"
      directory: "/bindings/js/pkg"
      schedule:
          interval: "monthly"
      cooldown:
        default-days: 7
      commit-message:
          prefix: "deps"
      rebase-strategy: "auto"
      groups:
          npm-minor-and-patch:
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"
          npm-major:
              patterns:
                  - "*"
              update-types:
                  - "major"

    # GitHub Actions used by the workflows
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "tuesday"
          time: "08:00"
      commit-message:
          prefix: "ci"
      rebase-strategy: "auto"
      cooldown:
          default-days: 7
      groups:
          github-actions-minor-and-patch:
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"
          github-actions-major:
              patterns:
                  - "*"
              update-types:
                  - "major"
